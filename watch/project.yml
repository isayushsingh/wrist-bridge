# XcodeGen spec — generates WristBridge.xcodeproj.
#   brew install xcodegen
#   cd watch && xcodegen generate && open WristBridge.xcodeproj
# Never hand-edit the .xcodeproj; change this file and regenerate.
name: WristBridge
options:
  bundleIdPrefix: com.example.wristbridge
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WristBridge:
    type: application
    platform: watchOS
    sources:
      - path: WristBridge
      - path: Shared
    dependencies:
      - target: WristBridgeWidget
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - WristBridgeUITests
    info:
      path: WristBridge/Info.plist
      properties:
        CFBundleDisplayName: WristBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        BRIDGE_BASE_URL: $(BRIDGE_BASE_URL)
        BRIDGE_API_KEY: $(BRIDGE_API_KEY)
        BRIDGE_COMPLICATION_APP: $(BRIDGE_COMPLICATION_APP)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
  WristBridgeWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: WristBridgeWidget
      - path: Shared
    info:
      path: WristBridgeWidget/Info.plist
      properties:
        CFBundleDisplayName: WristBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        BRIDGE_BASE_URL: $(BRIDGE_BASE_URL)
        BRIDGE_API_KEY: $(BRIDGE_API_KEY)
        BRIDGE_COMPLICATION_APP: $(BRIDGE_COMPLICATION_APP)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  # UI test: taps through the demo (list → Tasks → task → toggle → delete → back) like a person would.
  # Needs the proxy running at BRIDGE_BASE_URL. Run: see docs/07-watch-app.md → "UI test".
  WristBridgeUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WristBridgeUITests
    dependencies:
      - target: WristBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WristBridge
        TARGETED_DEVICE_FAMILY: "4"
